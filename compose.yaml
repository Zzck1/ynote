services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ynote-web:local
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8792:8792"
    environment:
      YNOTE_CLOUD_DATA: /data
      YNOTE_PLATFORM_PRICE_FILE: /app/backend/platform-price.json
      YNOTE_ALLOWED_ORIGINS: "${YNOTE_ALLOWED_ORIGINS:?请填写网站的完整 HTTPS Origin}"
      YNOTE_SILICONFLOW_API_KEY: "${YNOTE_SILICONFLOW_API_KEY:?请在服务器 Secret 或 .env 中配置平台 Key}"
      YNOTE_PLATFORM_PROFILE_VERIFIED: "${YNOTE_PLATFORM_PROFILE_VERIFIED:-0}"
      YNOTE_PLATFORM_ASR_VERIFIED: "${YNOTE_PLATFORM_ASR_VERIFIED:-0}"
      YNOTE_DAILY_SHARED_BUDGET_CNY: "${YNOTE_DAILY_SHARED_BUDGET_CNY:-10.00}"
    volumes:
      - ynote-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8792/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 15s

volumes:
  ynote-data:
